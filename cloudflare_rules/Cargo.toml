[package]
edition = "2024"
name = "cloudflare-rules"
version = "0.1.0"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["lib", "cdylib"]
name = "cloudflare_rules"

[features]
python = ["dep:pyo3"]

[dependencies]
erased-serde = "0.4.10"
inventory = "0.3.24"
ipnet = {version = "2.12.2", features = ["serde"]}
pyo3 = {version = "0.29.3", features = ["anyhow"], optional = true}
regex-syntax = "0.8.11"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
strum = {version = "0.28.0", features = ["derive"]}
wirefilter-engine = {git = "https://github.com/jonasbb/wirefilter/", rev = "b637246e0f40fc584a9ee04bc5804a977b1cbc83", features = [
    "regex",
]}

[target.wasm32-unknown-unknown.dependencies]
web-time = "1.1.0"

[dev-dependencies]
expect-test = "1.5.1"
pretty_assertions = "1.4.1"

[lints]
workspace = true
