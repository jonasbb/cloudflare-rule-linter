<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloudflare Rule Linter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <script type="module">
        import init from '../pkg/wirefilter_wasm.js';
        await init();
    </script>
</head>

<body class="container-lg">
    <label for="cloudflare-rules-phase">Choose a Cloudflare Phase:</label>
    <select name="cloudflare-rules-phase" id="cloudflare-rules-phase">
        <option value="maximum" selected>Combined Ruleset with all Fields and Functions</option>
        <option disabled>---Request Phases---</option>
        <option value="http_request_dynamic_redirect">Single Redirects</option>
        <option value="http_request_sanitize">URL normalization</option>
        <option value="http_request_transform">URL Rewrite Rules</option>
        <option value="http_request_api_gateway_early">API Shield</option>
        <option value="http_config_settings">Configuration Rules</option>
        <option value="http_request_origin">Origin Rules</option>
        <option value="http_request_firewall_custom">Custom rules (Web Application Firewall)</option>
        <option value="http_ratelimit">Rate limiting rules (WAF)</option>
        <option value="http_request_api_gateway_late">API Shield</option>
        <option value="http_request_firewall_managed">WAF Managed Rules</option>
        <option value="http_request_sbfm">Super Bot Fight Mode</option>
        <option value="http_request_redirect">Bulk Redirects</option>
        <option value="http_request_late_transform">Request Header Transform Rules</option>
        <option value="http_request_cache_settings">Cache Rules</option>
        <option value="http_request_snippets">Snippets</option>
        <option value="http_request_cloud_connector">Cloud Connector</option>
        <option disabled>---Response Phases---</option>
        <option value="http_custom_errors">Custom Errors</option>
        <option value="http_response_headers_transform">Response Header Transform Rules</option>
        <option value="http_ratelimit_counting_expression">Rate limiting rules Counting Expression</option>
        <option value="http_response_compression">Compression Rules</option>
        <option value="http_response_firewall_managed">Cloudflare Sensitive Data Detection</option>
        <option value="http_log_custom_fields">Logpush custom fields</option>
    </select>

    <textarea id="cloudflare-rules-input" class="form-control" rows="5"
        placeholder="Enter a Cloudflare firewall rule expression..."></textarea>
    <br>
    <pre id="cloudflare-rules-output" class="" role="alert"></pre>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
