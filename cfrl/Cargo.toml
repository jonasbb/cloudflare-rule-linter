[package]
description = "Simple wirefilter linter for tfvar files"
edition = "2024"
name = "cfrl"
publish = false
version = "0.1.0"

[dependencies]
annotate-snippets = "0.12.16"
anyhow = "1.0.104"
clap = {version = "4.6.7", features = ["color", "derive"]}
cloudflare-rules = {path = "../cloudflare_rules"}
env_logger = "0.11.11"
hcl-edit = "0.9.7"
log = "0.4.34"
toml = "1.1.6"

[lints]
workspace = true
